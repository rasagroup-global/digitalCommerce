# ═══════════════════════════════════════════════════════════
# WordPress + WooCommerce stack — shop-dev.rasakopi.coffee
# Stack isolated: network shop-woo-net, tidak menyentuh
# 11 container lain di rasa-shared-net.
# ═══════════════════════════════════════════════════════════
services:
  shop-woo-web:
    image: wordpress:7.1.4-php8.5-fpm
    container_name: shop-woo-web
    restart: unless-stopped
    depends_on:
      shop-woo-db:
        condition: service_healthy
    env_file: .env
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - wp_content:/var/www/html
      - ./php/override.ini:/usr/local/etc/php/conf.d/99-rasa-override.ini:ro
    networks:
      - shop-woo-net
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(0);'"]
      interval: 30s
      timeout: 5s
      retries: 3

  shop-woo-nginx:
    image: nginx:alpine
    container_name: shop-woo-nginx
    restart: unless-stopped
    volumes:
      - wp_content:/var/www/html:ro
      - ./conf/nginx/shop-woo.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - shop-woo-net
    mem_limit: 128m
    memswap_limit: 128m
    # Internal only — trafik masuk via rasa-shared-proxy

  shop-woo-db:
    image: mariadb:12.3
    container_name: shop-woo-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME}
      MARIADB_USER: ${WORDPRESS_DB_USER}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_PASSWORD}Root
    volumes:
      - wp_db_data:/var/lib/mysql
      - ./php/db.cnf:/etc/mysql/conf.d/99-rasa.cnf:ro
    networks:
      - shop-woo-net
    mem_limit: 512m
    memswap_limit: 512m
    command: >
      --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL}
      --max-connections=${MYSQL_MAX_CONNECTIONS}
      --binlog_expire_logs_seconds=2592000
      --log_bin=mysql-bin
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  wp_content:
  wp_db_data:

networks:
  shop-woo-net:
    name: shop-woo-net
