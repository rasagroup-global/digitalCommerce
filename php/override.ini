; ═══════════════════════════════════════════════════════════
; Rasa security hardening — PHP 8.5 (image wordpress:php8.5-fpm
; = PHP 8.5.x patched, termasuk mitigasi family CVE RCE/upload)
; Diantar read-only ke container sebagai conf.d/99-rasa-override.ini
; ═══════════════════════════════════════════════════════════

; ── Resource limits (anti DoS / OOM, server ~2GB RAM) ──
memory_limit = 256M
max_execution_time = 120
max_input_vars = 3000
max_input_time = 60
upload_max_filesize = 64M
post_max_size = 68M
file_uploads = On
upload_tmp_dir = /tmp

; ── Expose/visibility ──
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; ── Session hardening (CVE-2024-11234 family) ──
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.sid_bits_per_character = 6
session.gc_maxlifetime = 1440

; ── Disable dangerous functions (anti RCE / php2shell-class) ──
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,dl,eval,assert

; ── Filesystem confinement ──
open_basedir = /var/www/html:/tmp:/var/lib/php/sessions
realpath_cache_size = 4096K
session.save_path = /tmp

; ── Timezone (WIB) ──
date.timezone = Asia/Jakarta
