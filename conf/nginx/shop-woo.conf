# ═══════════════════════════════════════════════════════════
# WordPress + WooCommerce — internal nginx (shop-woo-nginx)
# Trafik masuk dari rasa-shared-proxy (proxy_pass ke shop-woo-nginx:80)
# ═══════════════════════════════════════════════════════════
server {
    listen 80;
    server_name shop-dev.rasakopi.coffee www.shop-dev.rasakopi.coffee;
    root /var/www/html;
    index index.php index.html;

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 128m;

    # ── WC + WP permalinks ──
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # ── WooCommerce AJAX / REST ──
    location ~ ^/(wp-json/|wp-admin/admin-ajax.php) {
        try_files $uri /index.php?$args;
    }

    # ── Static assets: cache ──
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── PHP via fpm (hardened) ──
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass shop-woo-web:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffering on;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 64k;
    }

    # ── Block sensitive files ──
    location ~ /\.env { deny all; }
    location ~ \.(sql|md|log)$ { deny all; }
    location ~ wp-config\.php$ { deny all; }

    # ── Anti webshell: blokir PHP di uploads/media ──
    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }
    location ~* ^/wp-content/.*\.(phar|phtml)$ {
        deny all;
    }
}
